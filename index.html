<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>REVELUP</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

.container{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  font-size:58px;
  margin-bottom:10px;
  font-weight:900;
}

.subtitle{
  text-align:center;
  color:#555;
  margin-bottom:40px;
  font-size:16px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-bottom:24px;
}

.card{
  background:white;
  border-radius:20px;
  padding:22px;
  border:2px solid #e5e5e5;
}

.card h2{
  margin:0;
  font-size:52px;
}

.card p{
  margin-top:8px;
  color:#666;
  font-size:14px;
}

.toolbar{
  background:white;
  border-radius:20px;
  padding:16px;
  margin-bottom:24px;
  border:2px solid #e5e5e5;
  display:flex;
  gap:12px;
}

.search{
  flex:1;
}

.search input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:2px solid #ddd;
  font-size:15px;
}

select{
  padding:14px;
  border-radius:14px;
  border:2px solid #ddd;
  font-size:15px;
  min-width:220px;
}

button{
  border:none;
  cursor:pointer;
  transition:0.2s;
}

.btn-primary{
  background:#19e0d0;
  padding:14px 22px;
  border-radius:14px;
  font-weight:700;
  font-size:15px;
}

.btn-primary:hover{
  opacity:0.9;
}

.form-box{
  background:white;
  border-radius:20px;
  padding:22px;
  border:2px solid #e5e5e5;
  margin-bottom:24px;
}

.form-box h3{
  margin-top:0;
  font-size:28px;
}

.form-group{
  margin-bottom:18px;
}

.form-group label{
  display:block;
  margin-bottom:8px;
  font-weight:700;
}

input,
textarea{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:2px solid #ddd;
  font-size:15px;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.actions{
  display:flex;
  gap:10px;
}

.result{
  background:white;
  border-radius:20px;
  padding:22px;
  border:2px solid #e5e5e5;
  margin-bottom:18px;
}

.result h3{
  margin-top:0;
  font-size:22px;
}

.badge{
  display:inline-block;
  padding:7px 14px;
  border-radius:999px;
  background:#19e0d0;
  font-size:13px;
  margin-bottom:16px;
}

.tags{
  margin-top:18px;
  color:#666;
}

.result-actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.btn-secondary{
  background:#ddd;
  padding:12px 18px;
  border-radius:12px;
  font-weight:700;
}

.btn-danger{
  background:#ff5b5b;
  color:white;
  padding:12px 18px;
  border-radius:12px;
  font-weight:700;
}

mark{
  background:#fff59d;
  padding:2px 4px;
  border-radius:4px;
}

.content-block{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.content-section{
  background:#fafafa;
  border-left:4px solid #10e7cf;
  padding:14px;
  border-radius:12px;
}

.content-section strong{
  display:block;
  margin-bottom:8px;
  font-size:15px;
}

.content-section ul{
  margin:0;
  padding-left:18px;
}

.content-section li{
  margin-bottom:8px;
  line-height:1.7;
}

@media(max-width:900px){

  .stats{
    grid-template-columns:1fr;
  }

  .toolbar{
    flex-direction:column;
  }

  select{
    width:100%;
  }

  h1{
    font-size:42px;
  }

}

</style>
</head>

<body>

<div class="container">

<h1>REVELUP</h1>

<div class="subtitle">
Base de conocimiento inteligente
</div>

<div class="stats">

  <div class="card">
    <h2 id="totalEntries">0</h2>
    <p>Entradas</p>
  </div>

  <div class="card">
    <h2 id="totalIncidents">0</h2>
    <p>Incidencias</p>
  </div>

  <div class="card">
    <h2 id="totalProcedures">0</h2>
    <p>Procedimientos</p>
  </div>

</div>

<div class="toolbar">

  <div class="search">
    <input
      type="text"
      id="search"
      placeholder="Buscar procedimientos, incidencias..."
      oninput="render()"
    >
  </div>

  <select id="filter" onchange="render()">
    <option value="">Todas</option>
    <option value="procedimiento">Procedimientos</option>
    <option value="documentacion">Documentación</option>
    <option value="incidencia">Incidencias</option>
    <option value="taller">Talleres</option>
  </select>

  <button
    class="btn-primary"
    onclick="toggleForm()"
  >
    + Nueva entrada
  </button>

</div>

<div
  class="form-box"
  id="formBox"
  style="display:none;"
>

<h3>Nueva entrada</h3>

<div class="form-group">
  <label>Título</label>
  <input type="text" id="title">
</div>

<div class="form-group">

  <label>Tipo</label>

  <select id="type">
    <option value="procedimiento">Procedimiento</option>
    <option value="documentacion">Documentación</option>
    <option value="incidencia">Incidencia</option>
    <option value="taller">Taller</option>
  </select>

</div>

<div class="form-group">
  <label>Descripción</label>
  <textarea id="desc"></textarea>
</div>

<div
  class="form-group"
  id="solutionGroup"
  style="display:none;"
>

  <label>Solución</label>

  <textarea id="sol"></textarea>

</div>

<div class="form-group">

  <label>Tags</label>

  <input
    type="text"
    id="tags"
    placeholder="#onboarding #workflow"
  >

</div>

<div class="actions">

  <button
    class="btn-primary"
    onclick="saveEntry()"
  >
    Guardar
  </button>

  <button
    class="btn-secondary"
    onclick="toggleForm()"
  >
    Cancelar
  </button>

</div>

</div>

<div id="results"></div>

</div>

<script>

const SUPABASE_URL =
"https://nhthjjendeyfnxqfjuyh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kyCafDjTzfBOINRtuHJpkg_qqh_yoT1";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let entries = [];

let editingId = null;

document
.getElementById("type")
.addEventListener(
  "change",
  toggleSolution
);

function toggleSolution(){

  const type =
  document.getElementById("type").value;

  document.getElementById(
    "solutionGroup"
  ).style.display =
    type === "incidencia"
    ? "block"
    : "none";

}

function toggleForm(){

  const form =
  document.getElementById("formBox");

  form.style.display =
    form.style.display === "none"
    ? "block"
    : "none";

}

function clearForm(){

  editingId = null;

  document.getElementById(
    "title"
  ).value = "";

  document.getElementById(
    "desc"
  ).value = "";

  document.getElementById(
    "sol"
  ).value = "";

  document.getElementById(
    "tags"
  ).value = "";

  document.getElementById(
    "type"
  ).value = "procedimiento";

  toggleSolution();

}

async function loadEntries(){

  const { data,error } =
  await supabaseClient
  .from("entries")
  .select("*")
  .order("id",{ascending:false});

  if(error){
    console.error(error);
    return;
  }

  entries = data || [];

  updateStats();

  render();

}

function updateStats(){

  document.getElementById(
    "totalEntries"
  ).innerText =
    entries.length;

  document.getElementById(
    "totalIncidents"
  ).innerText =
    entries.filter(
      e => e.type === "incidencia"
    ).length;

  document.getElementById(
    "totalProcedures"
  ).innerText =
    entries.filter(
      e =>
        e.type === "procedimiento"
        || e.type === "documentacion"
        || e.type === "taller"
    ).length;

}

function highlight(text,query){

  if(!query) return text;

  const regex =
  new RegExp(`(${query})`,"gi");

  return text.replace(
    regex,
    `<mark>$1</mark>`
  );

}

function formatContent(text){

  if(!text) return "";

  const sections =
  text.split("🔹");

  return sections.map(section => {

    if(section.trim()==="") return "";

    const lines =
    section.trim().split("\n");

    const title =
    lines[0];

    const items =
    lines.slice(1);

    return `
      <div class="content-section">

        <strong>${title}</strong>

        <ul>
          ${items.map(item => `
            <li>${item}</li>
          `).join("")}
        </ul>

      </div>
    `;

  }).join("");

}

function render(){

  const q =
  document
  .getElementById("search")
  .value
  .toLowerCase();

  const filter =
  document
  .getElementById("filter")
  .value;

  const fuse =
  new Fuse(entries, {

    keys:[
      "title",
      "desc",
      "tags",
      "sol",
      "type"
    ],

    threshold:0.35,

    includeScore:true

  });

  let filtered;

  if(q){

    filtered =
      fuse
      .search(q)
      .map(r => r.item);

  }else{

    filtered = entries;

  }

  if(filter){

    filtered =
      filtered.filter(
        e => e.type === filter
      );

  }

  const html =
  filtered.map(e => `

    <div class="result">

      <h3>
        ${highlight(e.title,q)}
      </h3>

      <div class="badge">
        ${e.type}
      </div>

      <div class="content-block">

        ${formatContent(
          highlight(e.desc || "", q)
        )}

      </div>

      ${
        e.type === "incidencia"
        && e.sol
        ?
        `
        <div class="content-section">

          <strong>
            Solución
          </strong>

          ${highlight(e.sol,q)}

        </div>
        `
        :
        ""
      }

      <div class="tags">
        ${highlight(e.tags || "",q)}
      </div>

      <div class="result-actions">

        <button
          class="btn-secondary"
          onclick="edit(${e.id})"
        >
          Editar
        </button>

        <button
          class="btn-danger"
          onclick="del(${e.id})"
        >
          Eliminar
        </button>

      </div>

    </div>

  `).join("");

  document.getElementById(
    "results"
  ).innerHTML = html;

}

async function saveEntry(){

  const title =
  document.getElementById(
    "title"
  ).value;

  const desc =
  document.getElementById(
    "desc"
  ).value;

  const sol =
  document.getElementById(
    "sol"
  ).value;

  const type =
  document.getElementById(
    "type"
  ).value;

  const tags =
  document.getElementById(
    "tags"
  ).value;

  if(!title || !desc){

    alert("Completa los campos");

    return;

  }

  if(editingId){

    await supabaseClient
    .from("entries")
    .update({
      title,
      desc,
      sol,
      type,
      tags
    })
    .eq("id",editingId);

  }else{

    await supabaseClient
    .from("entries")
    .insert([{
      title,
      desc,
      sol,
      type,
      tags
    }]);

  }

  clearForm();

  toggleForm();

  loadEntries();

}

function edit(id){

  const e =
  entries.find(
    x => x.id === id
  );

  if(!e) return;

  editingId = id;

  document.getElementById(
    "title"
  ).value = e.title;

  document.getElementById(
    "desc"
  ).value = e.desc;

  document.getElementById(
    "sol"
  ).value = e.sol || "";

  document.getElementById(
    "type"
  ).value = e.type;

  document.getElementById(
    "tags"
  ).value = e.tags || "";

  toggleSolution();

  document.getElementById(
    "formBox"
  ).style.display = "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

async function del(id){

  if(!confirm(
    "Eliminar entrada?"
  )) return;

  await supabaseClient
  .from("entries")
  .delete()
  .eq("id",id);

  loadEntries();

}

loadEntries();

</script>

</body>
</html>
