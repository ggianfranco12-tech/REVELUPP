<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REVELUP</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

h1{
  text-align:center;
  font-size:64px;
  margin-bottom:10px;
  font-weight:900;
}

.subtitle{
  text-align:center;
  font-size:20px;
  margin-bottom:40px;
  color:#444;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.stat-card{
  background:#fff;
  border:3px solid #e5e5e5;
  border-radius:22px;
  padding:30px;
}

.stat-card h2{
  margin:0;
  font-size:54px;
}

.stat-card p{
  margin-top:10px;
  font-size:20px;
  color:#444;
}

.search-box{
  background:#fff;
  border:3px solid #e5e5e5;
  border-radius:24px;
  padding:25px;
  margin-bottom:25px;
}

.search-grid{
  display:grid;
  grid-template-columns:1fr 300px 220px;
  gap:15px;
}

input,
select,
textarea{
  width:100%;
  padding:18px;
  border-radius:18px;
  border:3px solid #ddd;
  font-size:18px;
}

textarea{
  min-height:130px;
}

button{
  border:0;
  border-radius:18px;
  cursor:pointer;
  font-weight:700;
  font-size:18px;
}

.btn-primary{
  background:#12e8cf;
  color:#000;
}

.btn-secondary{
  background:#ddd;
}

.btn-danger{
  background:#ff4d4d;
  color:#fff;
}

.btn{
  padding:18px;
}

.form-box{
  background:#fff;
  border:3px solid #e5e5e5;
  border-radius:24px;
  padding:25px;
  margin-bottom:25px;
}

.hidden{
  display:none;
}

.result{
  background:#fff;
  border:3px solid #e8e8e8;
  border-radius:24px;
  padding:25px;
  margin-bottom:20px;
}

.result h3{
  margin-top:0;
  font-size:28px;
}

.tag{
  display:inline-block;
  padding:8px 14px;
  border-radius:12px;
  background:#12e8cf;
  margin-right:8px;
  margin-bottom:8px;
  font-size:14px;
  font-weight:bold;
}

.solution{
  background:#eafffb;
  border-left:5px solid #12e8cf;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.empty{
  text-align:center;
  padding:60px;
  color:#666;
}

@media(max-width:900px){

  .search-grid{
    grid-template-columns:1fr;
  }

  h1{
    font-size:42px;
  }
}

</style>
</head>

<body>

<div class="container">

<h1>REVELUP</h1>
<p class="subtitle">Base de conocimiento inteligente</p>

<div class="stats">

  <div class="stat-card">
    <h2 id="totalEntries">0</h2>
    <p>Entradas</p>
  </div>

  <div class="stat-card">
    <h2 id="totalIncidents">0</h2>
    <p>Incidencias</p>
  </div>

  <div class="stat-card">
    <h2 id="totalCategories">0</h2>
    <p>Categorías</p>
  </div>

</div>

<div class="search-box">

  <div class="search-grid">

    <input
      id="search"
      placeholder="Buscar..."
    >

    <select id="filterType">
      <option value="">Todos los tipos</option>
      <option value="procedimiento">Procedimiento</option>
      <option value="tip">Tip</option>
      <option value="documentacion">Documentación</option>
      <option value="incidencia">Incidencia</option>
    </select>

    <button
      class="btn btn-primary"
      onclick="toggleForm()"
    >
      + Nueva entrada
    </button>

  </div>

</div>

<div
  id="formBox"
  class="form-box hidden"
>

  <h2 id="formTitle">Nueva entrada</h2>

  <input id="idEdit" type="hidden">

  <br>

  <label>Título</label>
  <input id="fTitle">

  <br><br>

  <label>Categoría</label>
  <input id="fCategory">

  <br><br>

  <label>Tipo</label>

  <select id="fType">
    <option value="procedimiento">Procedimiento</option>
    <option value="tip">Tip</option>
    <option value="documentacion">Documentación</option>
    <option value="incidencia">Incidencia</option>
  </select>

  <br><br>

  <label>Descripción</label>
  <textarea id="fDesc"></textarea>

  <br><br>

  <label>Solución</label>
  <textarea id="fSol"></textarea>

  <br><br>

  <label>Tags</label>
  <input id="fTags">

  <br><br>

  <div class="actions">

    <button
      class="btn btn-primary"
      onclick="save()"
    >
      Guardar
    </button>

    <button
      class="btn btn-secondary"
      onclick="toggleForm()"
    >
      Cancelar
    </button>

  </div>

</div>

<div id="results"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

const SUPABASE_URL =
"https://nhthjjendeyfnxqfjuyh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kyCafDjTzfBOINRtuHJpkg_qqh_yoT1";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let entries = [];

function toggleForm(){

  const form =
  document.getElementById("formBox");

  form.classList.toggle("hidden");

  if(form.classList.contains("hidden")){
    clearForm();
  }
}

function clearForm(){

  idEdit.value = "";
  fTitle.value = "";
  fCategory.value = "";
  fType.value = "procedimiento";
  fDesc.value = "";
  fSol.value = "";
  fTags.value = "";
}

async function loadEntries(){

  const { data, error } =
  await supabaseClient
    .from("entries")
    .select("*")
    .order("id", {
      ascending:false
    });

  if(error){
    console.error(error);
    return;
  }

  entries = data || [];

  updateStats();

  render();
}

function updateStats(){

  totalEntries.textContent =
  entries.length;

  totalIncidents.textContent =
  entries.filter(
    e => e.type === "incidencia"
  ).length;

  totalCategories.textContent =
  new Set(
    entries.map(
      e => e.category
    )
  ).size;
}

async function save(){

  let id = idEdit.value;

  let title =
  fTitle.value.trim();

  let category =
  fCategory.value.trim();

  let type =
  fType.value;

  let desc =
  fDesc.value.trim();

  let sol =
  fSol.value.trim();

  let tags =
  fTags.value.trim();

  if(
    !title ||
    !category ||
    !desc
  ){
    alert("Completa los campos");
    return;
  }

  if(id){

    const { error } =
    await supabaseClient
      .from("entries")
      .update({
        title,
        category,
        type,
        desc,
        sol,
        tags
      })
      .eq("id", id);

    if(error){
      alert("Error actualizando");
      console.error(error);
      return;
    }

  }else{

    const { error } =
    await supabaseClient
      .from("entries")
      .insert([
        {
          title,
          category,
          type,
          desc,
          sol,
          tags
        }
      ]);

    if(error){
      alert("Error guardando");
      console.error(error);
      return;
    }
  }

  toggleForm();

  await loadEntries();
}

function edit(id){

  const e =
  entries.find(
    x => x.id == id
  );

  if(!e) return;

  idEdit.value = e.id;
  fTitle.value = e.title;
  fCategory.value = e.category;
  fType.value = e.type;
  fDesc.value = e.desc;
  fSol.value = e.sol;
  fTags.value = e.tags;

  document
    .getElementById("formBox")
    .classList
    .remove("hidden");
}

async function del(id){

  if(confirm("¿Eliminar entrada?")){

    const { error } =
    await supabaseClient
      .from("entries")
      .delete()
      .eq("id", id);

    if(error){
      console.error(error);
      return;
    }

    await loadEntries();
  }
}

search.oninput = render;
filterType.onchange = render;

function render(){

  let q =
  search.value.toLowerCase();

  let f =
  filterType.value;

  let list =
  entries.filter(e => {

    let ok =

      (e.title || "")
      .toLowerCase()
      .includes(q)

      ||

      (e.desc || "")
      .toLowerCase()
      .includes(q)

      ||

      (e.category || "")
      .toLowerCase()
      .includes(q)

      ||

      (e.tags || "")
      .toLowerCase()
      .includes(q);

    return ok &&
    (!f || e.type === f);
  });

  if(list.length === 0){

    results.innerHTML =
    `
      <div class="empty">
        No hay resultados
      </div>
    `;

    return;
  }

  results.innerHTML =
  list.map(e => `

    <div class="result">

      <h3>${e.title}</h3>

      <div>

        <span class="tag">
          ${e.category}
        </span>

        <span class="tag">
          ${e.type}
        </span>

      </div>

      <p>${e.desc}</p>

      ${
        e.type === "incidencia"
        &&
        e.sol

        ?

        `
          <div class="solution">
            <b>Solución:</b>
            <br><br>
            ${e.sol}
          </div>
        `

        :

        ""
      }

      <div style="margin-top:15px;">

        ${
          (e.tags || "")
          .split(",")
          .map(t => `
            <span class="tag">
              #${t.trim()}
            </span>
          `)
          .join("")
        }

      </div>

      <div class="actions">

        <button
          class="btn btn-secondary"
          onclick="edit(${e.id})"
        >
          Editar
        </button>

        <button
          class="btn btn-danger"
          onclick="del(${e.id})"
        >
          Eliminar
        </button>

      </div>

    </div>

  `).join("");
}

loadEntries();

</script>

</body>
</html>
