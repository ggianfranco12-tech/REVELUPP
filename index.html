<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>REVELUP</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
  zoom:0.72;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:8px;
}

h1{
  text-align:center;
  font-size:42px;
  margin-bottom:10px;
  font-weight:900;
}

.subtitle{
  text-align:center;
  font-size:16px;
  color:#555;
  margin-bottom:30px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:20px;
}

.card{
  background:white;
  border:2px solid #ddd;
  border-radius:18px;
  padding:18px;
}

.card h2{
  margin:0;
  font-size:38px;
}

.card p{
  margin-top:8px;
  font-size:15px;
  color:#555;
}

.box{
  background:white;
  border:2px solid #ddd;
  border-radius:18px;
  padding:14px;
  margin-bottom:20px;
}

.topbar{
  display:flex;
  gap:10px;
  align-items:center;
}

.topbar input{
  flex:1;
}

input,
select,
textarea{
  width:100%;
  padding:10px;
  border-radius:12px;
  border:2px solid #ccc;
  font-size:13px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  padding:10px 16px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
  font-size:13px;
}

.btn-primary{
  background:#10e7cf;
}

.btn-secondary{
  background:#d9d9d9;
}

.btn-danger{
  background:#ff5f5f;
  color:white;
}

.hidden{
  display:none;
}

.result{
  background:white;
  border:2px solid #ddd;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}

.result h3{
  margin-top:0;
  font-size:20px;
}

.tag{
  display:inline-block;
  background:#10e7cf;
  padding:4px 8px;
  border-radius:10px;
  margin-right:4px;
  margin-bottom:4px;
  font-size:11px;
}

.solution{
  margin-top:10px;
  background:#e9fffb;
  border-left:4px solid #10e7cf;
  padding:10px;
  border-radius:10px;
  font-size:13px;
}

.actions{
  margin-top:12px;
}

label{
  font-size:13px;
  font-weight:bold;
}

@media(max-width:900px){

  body{
    zoom:1;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .topbar{
    flex-direction:column;
  }

  h1{
    font-size:34px;
  }

}

</style>
</head>

<body>

<div class="container">

<h1>REVELUP</h1>
<p class="subtitle">Base de conocimiento inteligente</p>

<div class="stats">

  <div class="card">
    <h2 id="totalEntries">0</h2>
    <p>Entradas</p>
  </div>

  <div class="card">
    <h2 id="totalIncidents">0</h2>
    <p>Incidencias</p>
  </div>

  <div class="card">
    <h2 id="totalProcedures">0</h2>
    <p>Procedimientos</p>
  </div>

</div>

<div class="box">

  <div class="topbar">

    <input id="search" placeholder="Buscar...">

    <select id="filterType">
      <option value="">Todos los tipos</option>
      <option value="procedimiento">Procedimiento</option>
      <option value="tip">Tip / Truco</option>
      <option value="documentacion">Documentación</option>
      <option value="incidencia">Incidencia</option>
    </select>

    <button class="btn-primary" onclick="toggleForm()">
      + Nueva entrada
    </button>

  </div>

</div>

<div id="formBox" class="box hidden">

  <h2>Nueva entrada</h2>

  <input type="hidden" id="editId">

  <label>Título</label>
  <input id="fTitle">

  <br><br>

  <label>Tipo</label>

  <select id="fType">
    <option value="procedimiento">Procedimiento</option>
    <option value="tip">Tip / Truco</option>
    <option value="documentacion">Documentación</option>
    <option value="incidencia">Incidencia</option>
  </select>

  <br><br>

  <label>Descripción</label>
  <textarea id="fDesc"></textarea>

  <br><br>

  <div id="solBox" class="hidden">

    <label>Solución</label>
    <textarea id="fSol"></textarea>

    <br><br>

  </div>

  <label>Tags</label>
  <input id="fTags" placeholder="factura, error, cliente">

  <br><br>

  <button class="btn-primary" onclick="saveEntry()">
    Guardar
  </button>

  <button class="btn-secondary" onclick="toggleForm()">
    Cancelar
  </button>

</div>

<div id="results"></div>

</div>

<script>

let entries = [];

function toggleForm(){

  const box =
    document.getElementById("formBox");

  box.classList.toggle("hidden");

}

function toggleSolution(){

  const type =
    document.getElementById("fType").value;

  const solBox =
    document.getElementById("solBox");

  if(type === "incidencia"){

    solBox.classList.remove("hidden");

  }else{

    solBox.classList.add("hidden");

    document.getElementById("fSol").value = "";

  }

}

document
.getElementById("fType")
.addEventListener("change", toggleSolution);

function saveEntry(){

  const id =
    document.getElementById("editId").value
    || Date.now();

  const title =
    document.getElementById("fTitle")
    .value
    .trim();

  const type =
    document.getElementById("fType")
    .value;

  const desc =
    document.getElementById("fDesc")
    .value
    .trim();

  const sol =
    document.getElementById("fSol")
    .value
    .trim();

  const tags =
    document.getElementById("fTags")
    .value
    .split(",")
    .map(t => t.trim())
    .filter(Boolean);

  if(!title || !desc){

    alert("Completa los campos");

    return;

  }

  const existing =
    entries.find(e => e.id == id);

  if(existing){

    existing.title = title;
    existing.type = type;
    existing.desc = desc;
    existing.sol = sol;
    existing.tags = tags;

  }else{

    entries.unshift({
      id,
      title,
      type,
      desc,
      sol,
      tags
    });

  }

  clearForm();

  document
  .getElementById("formBox")
  .classList.add("hidden");

  render();

}

function clearForm(){

  document.getElementById("editId").value = "";
  document.getElementById("fTitle").value = "";
  document.getElementById("fType").value = "procedimiento";
  document.getElementById("fDesc").value = "";
  document.getElementById("fSol").value = "";
  document.getElementById("fTags").value = "";

  toggleSolution();

}

function editEntry(id){

  const e =
    entries.find(x => x.id == id);

  if(!e) return;

  document.getElementById("editId").value = e.id;
  document.getElementById("fTitle").value = e.title;
  document.getElementById("fType").value = e.type;
  document.getElementById("fDesc").value = e.desc;
  document.getElementById("fSol").value = e.sol;
  document.getElementById("fTags").value = e.tags.join(", ");

  toggleSolution();

  document
  .getElementById("formBox")
  .classList.remove("hidden");

}

function deleteEntry(id){

  if(confirm("¿Eliminar entrada?")){

    entries =
      entries.filter(e => e.id != id);

    render();

  }

}

function render(){

  const q =
    document.getElementById("search")
    .value
    .toLowerCase();

  const filter =
    document.getElementById("filterType")
    .value;

  const filtered =
    entries.filter(e => {

      const match =

        e.title.toLowerCase().includes(q)

        ||

        e.desc.toLowerCase().includes(q)

        ||

        e.tags.join(" ")
        .toLowerCase()
        .includes(q);

      return match &&
      (!filter || e.type === filter);

    });

  document.getElementById("results").innerHTML =

    filtered.map(e => `

      <div class="result">

        <h3>${e.title}</h3>

        <div>

          <span class="tag">
            ${e.type}
          </span>

        </div>

        <p>${e.desc}</p>

        ${
          e.type === "incidencia"
          &&
          e.sol

          ?

          `
          <div class="solution">

            <strong>Solución:</strong>

            <br><br>

            ${e.sol}

          </div>
          `

          :

          ""
        }

        <div style="margin-top:12px;">

          ${
            e.tags
            .map(t => `
              <span class="tag">
                #${t}
              </span>
            `)
            .join("")
          }

        </div>

        <div class="actions">

          <button
            class="btn-secondary"
            onclick="editEntry(${e.id})"
          >
            Editar
          </button>

          <button
            class="btn-danger"
            onclick="deleteEntry(${e.id})"
          >
            Eliminar
          </button>

        </div>

      </div>

    `).join("");

  updateStats();

}

function updateStats(){

  document.getElementById("totalEntries")
  .innerText =
    entries.length;

  document.getElementById("totalIncidents")
  .innerText =
    entries.filter(
      e => e.type === "incidencia"
    ).length;

  document.getElementById("totalProcedures")
  .innerText =
    entries.filter(
      e => e.type === "procedimiento"
    ).length;

}

document
.getElementById("search")
.addEventListener("input", render);

document
.getElementById("filterType")
.addEventListener("change", render);

toggleSolution();

render();

</script>

</body>
</html>
